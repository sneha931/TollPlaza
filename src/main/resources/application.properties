spring.application.name=toll-plaza-service
# Render and most PaaS hosts pass the port to listen on in $PORT
server.port=${PORT:8080}

# Project-local secrets (e.g. MAPPLS_API_KEY=...) from a git-ignored .env file in the project root.
# Optional: the app still starts without it. A real environment variable takes precedence.
spring.config.import=optional:file:.env[.properties]

# --- Database (in-memory H2; toll plazas are loaded from CSV at startup) ---
spring.datasource.url=jdbc:h2:mem:tolldb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
# Disabled in Docker/Render (Dockerfile sets SPRING_H2_CONSOLE_ENABLED=false): the console allows arbitrary SQL
spring.h2.console.enabled=true

# --- Caching (Caffeine) ---
# tollPlazaRoutes : full API response per source/destination pair
# pincodeLocations: pincode -> lat/lng (also protects Nominatim's 1 req/sec limit)
spring.cache.cache-names=tollPlazaRoutes,pincodeLocations
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=24h

# --- External services ---
toll.geocoding.base-url=https://nominatim.openstreetmap.org
# Nominatim's usage policy requires an identifying User-Agent
toll.geocoding.user-agent=toll-plaza-service/1.0
# Routing provider: mappls (follows national highways, needs a key) or osrm (free, no key).
# If mappls is selected but no key is set, the app logs a warning and falls back to OSRM.
toll.routing.provider=${ROUTING_PROVIDER:mappls}
toll.routing.mappls.base-url=https://route.mappls.com/route/direction
# Read from the MAPPLS_API_KEY environment variable. Never put the real key in this file.
toll.routing.mappls.api-key=${MAPPLS_API_KEY:}
toll.routing.osrm.base-url=https://router.project-osrm.org
toll.http.connect-timeout=5s
toll.http.read-timeout=15s

# --- Matching ---
# A plaza counts as "on the route" if it lies within this many metres of the route polyline
toll.matching.max-distance-from-route-meters=500
# Plazas closer than this to each other are the same physical plaza listed twice (e.g. alternate spellings)
toll.matching.duplicate-radius-meters=1000

# --- Data ---
toll.data.csv-location=classpath:data/toll_plaza_india.csv

# Swagger UI at /swagger-ui.html, OpenAPI JSON at /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
